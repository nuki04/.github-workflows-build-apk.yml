name: Build Exam Voice Browser APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android tools
        uses: android-actions/setup-android@v3

      - name: Install Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Extract and locate Android project
        shell: bash
        run: |
          if [ -f "ExamVoiceBrowser_Source.zip" ]; then
            echo "Mengekstrak ExamVoiceBrowser_Source.zip"
            rm -rf ExamVoiceBrowser
            unzip -q -o ExamVoiceBrowser_Source.zip
          fi

          if [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "ExamVoiceBrowser/settings.gradle" ]; then
            PROJECT_DIR="ExamVoiceBrowser"
          else
            echo "::error::settings.gradle tidak ditemukan"
            echo "Isi repository:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Folder proyek: $PROJECT_DIR"

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamVoiceBrowser-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            ExamVoiceBrowser/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
