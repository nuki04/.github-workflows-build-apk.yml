name: Build Exam Voice Browser APK V4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil source dari repository
        uses: actions/checkout@v4

      - name: Cari lokasi proyek Android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "ExamVoiceBrowser/settings.gradle" ]; then
            echo "PROJECT_DIR=ExamVoiceBrowser" >> "$GITHUB_ENV"
          else
            echo "ERROR: settings.gradle tidak ditemukan."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Android tools V4
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Pasang Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Pasang Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Buat Gradle Wrapper bila belum ada
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.4.1
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Buat APK debug
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamVoiceBrowser-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
