name: Build Exam Voice Browser APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Cari folder proyek Android
        shell: bash
        run: |
          if [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "ExamVoiceBrowser/settings.gradle" ]; then
            echo "PROJECT_DIR=ExamVoiceBrowser" >> "$GITHUB_ENV"
          else
            echo "::error::File settings.gradle tidak ditemukan"
            echo "Isi repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Buat Gradle Wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 9.4.1
          chmod +x gradlew

      - name: Build APK debug
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamVoiceBrowser-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            ExamVoiceBrowser/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
